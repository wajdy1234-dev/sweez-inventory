<title>جرد سويز</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap">
<style>
:root {
  --color-canvas: #F6F1E1;
  --color-surface: #FFFFFF;
  --color-surface-2: #FBF7EC;
  --color-surface-hover: #FFF7E6;
  --color-surface-muted: #F1EBDA;
  --color-border: #E7DCC0;
  --color-text: #2B2013;
  --color-text-muted: #8A7048;
  --color-on-accent: #FFFFFF;
  --color-accent: #E8752E;
  --color-accent-strong: #C85F1F;
  --color-accent-soft: #FDECC0;
  --color-brand-yellow: #FBD756;
  --color-success: #2E7D32;
  --color-success-bg: #E9F7EA;
  --color-success-bg-hover: #DFF3E0;
  --color-danger: #C0392B;
  --color-danger-bg: #FDECEA;
  --shadow: 0 1px 3px rgba(43,32,19,0.08), 0 1px 2px rgba(43,32,19,0.06);
  --shadow-md: 0 6px 16px rgba(43,32,19,0.14);
  --shadow-sticky: -6px 0 6px -6px rgba(0,0,0,0.14);
  --backdrop: rgba(20,15,8,0.5);
  --radius: 10px;
}

/* الشاشة ثابتة على التصميم الفاتح دائمًا بغض النظر عن إعداد الجهاز */
:root { color-scheme: light; }

* { box-sizing: border-box; }

html, body { margin: 0; padding: 0; height: 100%; }

body {
  font-family: 'Cairo', Tahoma, Arial, sans-serif;
  direction: rtl;
  background: var(--color-canvas);
  color: var(--color-text);
  font-size: 14px;
  line-height: 1.5;
}

button, input, select, textarea { font-family: inherit; font-size: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.app-header {
  background: var(--color-accent);
  color: var(--color-on-accent);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
  position: sticky;
  top: 0;
  z-index: 50;
  flex-wrap: wrap;
  gap: 8px;
}
.app-header .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 18px; cursor: pointer; }
.app-header .brand .logo-badge {
  background: var(--color-brand-yellow);
  color: var(--color-accent-strong);
  border-radius: 8px;
  padding: 3px 10px;
  font-weight: 900;
  letter-spacing: 1px;
}
.app-header nav { display: flex; gap: 6px; flex-wrap: wrap; }
.app-header nav a { text-decoration: none; color: #fff; padding: 7px 14px; border-radius: 8px; font-weight: 600; font-size: 13.5px; opacity: 0.92; }
.app-header nav a:hover { background: rgba(255,255,255,0.15); }
.app-header nav a.active { background: #fff; color: var(--color-accent-strong); opacity: 1; }

.page { max-width: 1400px; margin: 0 auto; padding: 18px 20px 60px; }
.page-narrow { max-width: 760px; }

.card { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 18px 20px; }

h1, h2, h3 { margin: 0 0 12px; font-weight: 800; text-wrap: balance; }
h1 { font-size: 22px; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }

.home-actions { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 16px; margin-top: 24px; }
.home-actions a.action-card {
  display: block; text-decoration: none; background: var(--color-surface); border: 1px solid var(--color-border);
  border-radius: var(--radius); padding: 22px 18px; box-shadow: var(--shadow); color: var(--color-text);
  transition: transform .12s ease, box-shadow .12s ease;
}
.home-actions a.action-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.home-actions a.action-card .icon { font-size: 28px; margin-bottom: 10px; display: block; }
.home-actions a.action-card .title { font-weight: 800; font-size: 16px; margin-bottom: 4px; }
.home-actions a.action-card .desc { color: var(--color-text-muted); font-size: 13px; }

.form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field label { font-weight: 700; font-size: 12.5px; color: var(--color-text-muted); }
.field input, .field select, .field textarea {
  border: 1px solid var(--color-border); border-radius: 8px; padding: 9px 11px;
  background: var(--color-surface); color: var(--color-text);
}
.field input:focus, .field select:focus, .field textarea:focus {
  outline: 2px solid var(--color-accent); outline-offset: 1px; border-color: var(--color-accent);
}
.field textarea { resize: vertical; min-height: 60px; }

.btn {
  display: inline-flex; align-items: center; gap: 7px; border: none; border-radius: 8px;
  padding: 9px 16px; font-weight: 700; font-size: 13.5px; cursor: pointer;
  transition: filter .1s ease, transform .05s ease;
}
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--color-accent); color: #fff; }
.btn-primary:hover { filter: brightness(1.06); }
.btn-secondary { background: var(--color-surface-muted); color: var(--color-text); }
.btn-secondary:hover { filter: brightness(0.97); }
.btn-outline { background: transparent; border: 1px solid var(--color-border); color: var(--color-text); }
.btn-danger { background: var(--color-danger-bg); color: var(--color-danger); }
.btn-success { background: var(--color-success-bg); color: var(--color-success); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.btn-icon { padding: 6px 9px; }

.toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; justify-content: space-between; }
.toolbar .group { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

.search-box { position: relative; min-width: 220px; }
.search-box input { width: 100%; padding: 9px 34px 9px 11px; border: 1px solid var(--color-border); border-radius: 8px; background: var(--color-surface); color: var(--color-text); }
.search-box .icon { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--color-text-muted); }

.summary-bar { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.summary-tile { background: var(--color-surface); border: 1px solid var(--color-border); border-radius: var(--radius); padding: 12px 14px; text-align: center; }
.summary-tile .value { font-size: 20px; font-weight: 800; color: var(--color-accent-strong); font-variant-numeric: tabular-nums; }
.summary-tile .label { font-size: 12px; color: var(--color-text-muted); margin-top: 2px; }
.summary-tile.value-danger .value { color: var(--color-danger); }
.summary-tile.value-success .value { color: var(--color-success); }

.table-wrap { overflow: auto; max-height: calc(100vh - 300px); min-height: 320px; border: 1px solid var(--color-border); border-radius: var(--radius); background: var(--color-surface); }

table.inv-table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1400px; font-size: 13px; font-variant-numeric: tabular-nums; }
table.inv-table thead th {
  position: sticky; top: 0; z-index: 3; background: var(--color-accent-soft); color: var(--color-accent-strong);
  font-weight: 800; padding: 9px 8px; border-bottom: 2px solid var(--color-accent); white-space: nowrap; text-align: center;
}
table.inv-table td { padding: 5px 7px; border-bottom: 1px solid var(--color-border); text-align: center; vertical-align: middle; white-space: nowrap; }
table.inv-table tbody tr:hover { background: var(--color-surface-hover); }
table.inv-table tbody tr.row-counted { background: var(--color-success-bg); }
table.inv-table tbody tr.row-counted:hover { background: var(--color-success-bg-hover); }
table.inv-table tbody tr.row-hidden { display: none; }

table.inv-table td.col-name, table.inv-table th.col-name {
  position: sticky; right: 0; z-index: 2; background: var(--color-surface); text-align: right; font-weight: 700;
  min-width: 190px; max-width: 240px; white-space: normal; box-shadow: var(--shadow-sticky);
}
table.inv-table thead th.col-name { z-index: 4; background: var(--color-accent-soft); }
table.inv-table tbody tr.row-counted td.col-name { background: var(--color-success-bg); }
table.inv-table tbody tr:hover td.col-name { background: var(--color-surface-hover); }
table.inv-table tbody tr.row-counted:hover td.col-name { background: var(--color-success-bg-hover); }

table.inv-table input, table.inv-table select {
  width: 100%; min-width: 74px; border: 1px solid transparent; border-radius: 6px; padding: 6px 6px;
  background: transparent; text-align: center; color: var(--color-text);
}
table.inv-table input:hover, table.inv-table select:hover { border-color: var(--color-border); background: var(--color-surface); }
table.inv-table input:focus, table.inv-table select:focus {
  border-color: var(--color-accent); background: var(--color-surface); outline: none; box-shadow: 0 0 0 2px rgba(232,117,46,0.22);
}
table.inv-table input.readonly-calc { background: var(--color-surface-muted); color: var(--color-text-muted); font-weight: 700; }
table.inv-table input.notes-input { text-align: right; min-width: 130px; }
table.inv-table td.col-value { font-weight: 800; color: var(--color-accent-strong); }

.unit-pair { display: flex; gap: 4px; align-items: center; }
.unit-pair input { min-width: 56px; }

.status-pill { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.status-pill.counted { background: var(--color-success-bg); color: var(--color-success); }
.status-pill.pending { background: var(--color-surface-muted); color: var(--color-text-muted); }

.badge { display:inline-block; padding:2px 8px; border-radius:6px; font-size:11px; font-weight:700; }
.badge.draft { background: var(--color-surface-muted); color: var(--color-text-muted); }
.badge.final { background: var(--color-success-bg); color: var(--color-success); }

table.plain-table { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.plain-table th, table.plain-table td { border-bottom: 1px solid var(--color-border); padding: 10px 8px; text-align: center; }
table.plain-table th { background: var(--color-accent-soft); color: var(--color-accent-strong); font-weight: 800; }
table.plain-table td.col-left { text-align: right; font-weight: 700; }
table.plain-table tbody tr:hover { background: var(--color-surface-hover); cursor: pointer; }

.items-manage-row { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-bottom: 1px solid var(--color-border); }
.items-manage-row .drag-handle { cursor: grab; color: var(--color-text-muted); user-select: none; }
.items-manage-row .name-input { flex: 1; min-width: 150px; }
.items-manage-row.inactive { opacity: 0.5; }

.modal-backdrop { position: fixed; inset: 0; background: var(--backdrop); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.modal { background: var(--color-surface); color: var(--color-text); border-radius: 12px; padding: 22px; max-width: 480px; width: 100%; box-shadow: var(--shadow-md); }
.modal h3 { margin-top: 0; }
.modal-actions { display: flex; justify-content: flex-start; gap: 8px; margin-top: 18px; flex-wrap: wrap; }

.toast-wrap { position: fixed; bottom: 18px; left: 18px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--color-text); color: var(--color-canvas); padding: 10px 16px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px; max-width: 360px; }
.toast.error { background: var(--color-danger); color: #fff; }
.toast.success { background: var(--color-success); color: #fff; }

.empty-state { text-align: center; padding: 50px 20px; color: var(--color-text-muted); }
.helper-text { font-size: 12px; color: var(--color-text-muted); margin-top: 4px; }
.loading-overlay { text-align: center; padding: 40px; color: var(--color-text-muted); }

#print-root { display: none; }

@media print {
  body > *:not(#print-root) { display: none !important; }
  #print-root { display: block !important; }
  #print-root, #print-root * { visibility: visible; }
  body { background: #fff; color: #000; }

  .print-report { font-family: 'Cairo', Tahoma, sans-serif; direction: rtl; text-align: right; color: #2b2013; }
  .print-header { padding: 0 0 12px; border-bottom: 3px solid #ef7d34; margin-bottom: 14px; }
  .print-brand-row { display: flex; align-items: baseline; justify-content: space-between; }
  .print-brand { font-size: 20px; font-weight: 800; color: #ef7d34; }
  .print-title { font-size: 15px; font-weight: 700; color: #2b2013; }
  .print-meta { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 16px; font-size: 11px; }
  .print-meta span.label { color: #8a7a5c; margin-left: 4px; }
  .print-meta span.value { font-weight: 700; }
  table.print-table { width: 100%; border-collapse: collapse; font-size: 10.5px; font-variant-numeric: tabular-nums; }
  table.print-table thead { display: table-header-group; }
  table.print-table tfoot { display: table-row-group; }
  table.print-table tr { page-break-inside: avoid; }
  table.print-table th, table.print-table td { border: 1px solid #e3d9c4; padding: 5px 6px; text-align: center; }
  table.print-table th { background: #fdecd2; color: #6b4a1f; font-weight: 700; }
  table.print-table td.name-cell, table.print-table th.name-cell { text-align: right; font-weight: 600; }
  table.print-table tbody tr:nth-child(even) { background: #fbf7ee; }
  table.print-table tfoot td { font-weight: 800; background: #fdecd2; color: #6b4a1f; font-size: 12px; }
  table.print-table .muted { color: #a99a7c; }
  table.print-table .not-counted { color: #b45309; }
}

@media (max-width: 720px) {
  .app-header { flex-direction: column; align-items: stretch; gap: 8px; }
  .app-header nav { justify-content: center; }
  .page { padding: 12px 10px 40px; }
  table.inv-table { min-width: 1100px; }
}
</style>

  if (Number.isNaN(num)) throw new Error(`قيمة "${label}" غير صالحة: يجب إدخال رقم فقط.`);
  if (!Number.isFinite(num)) throw new Error(`قيمة "${label}" غير صالحة: الرقم كبير جدًا أو غير منتهٍ.`);
  if (!allowNegative && num < 0) throw new Error(`قيمة "${label}" لا يمكن أن تكون سالبة.`);
  if (requirePositive && num === 0) throw new Error(`قيمة "${label}" يجب أن تكون أكبر من صفر.`);
  if (requireInteger && !Number.isInteger(num)) throw new Error(`قيمة "${label}" يجب أن تكون عددًا صحيحًا (بدون كسور).`);
  return num;
}

function computeItemCost({ base_unit, smallest_unit, base_to_smallest_factor, purchase_content_qty, purchase_content_unit, purchase_price }) {
  if (!base_unit || !smallest_unit || purchase_content_qty == null || !purchase_content_unit || purchase_price == null) {
    return { content_in_smallest: null, unit_cost: null };
  }
  const factor = base_unit === smallest_unit ? 1 : Number(base_to_smallest_factor);
  if (base_unit !== smallest_unit && (!factor || !Number.isFinite(factor) || factor <= 0)) {
    throw new Error('معامل تحويل الوحدة الأصغر غير مكتمل لهذا الصنف.');
  }
  let multiplier;
  if (purchase_content_unit === smallest_unit) multiplier = new Decimal(1);
  else if (purchase_content_unit === base_unit) multiplier = new Decimal(factor);
  else throw new Error('وحدة محتوى وحدة الشراء يجب أن تكون نفس وحدة الصنف أو وحدته الأصغر.');

  const contentQty = new Decimal(purchase_content_qty);
  if (contentQty.lte(0)) throw new Error('محتوى وحدة الشراء يجب أن يكون أكبر من صفر.');

  const contentInSmallest = contentQty.mul(multiplier);
  if (contentInSmallest.lte(0)) throw new Error('محتوى وحدة الشراء بالوحدة الأصغر يجب أن يكون أكبر من صفر.');

  const price = new Decimal(purchase_price);
  if (price.lt(0)) throw new Error('سعر الشراء لا يمكن أن يكون سالبًا.');

  const unitCost = price.div(contentInSmallest);
  if (!unitCost.isFinite()) throw new Error('تعذر احتساب تكلفة الوحدة الأصغر (قسمة على صفر).');

  return { content_in_smallest: contentInSmallest.toNumber(), unit_cost: unitCost.toNumber() };
}

function computeLineTotals({ base_unit, smallest_unit, base_to_smallest_factor, content_in_smallest, unit_cost, full_units_count, partial_qty, partial_unit }) {
  const isCounted = full_units_count !== null || partial_qty !== null;
  if (!isCounted) return { total_qty_smallest: null, inventory_value: null, is_counted: 0 };

  const factor = base_unit === smallest_unit ? 1 : Number(base_to_smallest_factor);
  let total = new Decimal(0);

  if (full_units_count !== null) {
    if (content_in_smallest == null) throw new Error('لا يمكن احتساب الكمية: بيانات وحدة الشراء (المحتوى/السعر) غير مكتملة لهذا الصنف.');
    total = total.add(new Decimal(full_units_count).mul(content_in_smallest));
  }

  if (partial_qty !== null) {
    let multiplier = new Decimal(1);
    if (base_unit !== smallest_unit) {
      if (partial_unit === smallest_unit) multiplier = new Decimal(1);
      else if (partial_unit === base_unit) {
        if (!factor || !Number.isFinite(factor) || factor <= 0) throw new Error('معامل تحويل الوحدة الأصغر غير مكتمل لهذا الصنف.');
        multiplier = new Decimal(factor);
      } else {
        throw new Error('وحدة الكمية الجزئية يجب أن تكون وحدة الصنف أو وحدته الأصغر.');
      }
    }
    total = total.add(new Decimal(partial_qty).mul(multiplier));
  }

  const value = unit_cost != null ? total.mul(unit_cost) : null;
  return { total_qty_smallest: total.toNumber(), inventory_value: value != null ? value.toNumber() : null, is_counted: 1 };
}

// ============================================================================
// الأصناف المعتمدة مسبقًا (الاسم فقط)

const SEED_ITEMS = [

  'زبدة سابوتو', 'حليب الصافي', 'فانيلا خام', 'فانيلا صناعي', 'بيكان', 'بسكوت دايجستف',
  'بسكوت عسل', 'بسكوت أولكر شاي', 'بسكوت جوزاء', 'نسكويك', 'كورنفلكس', 'شوكلت أوفومالتين',
  'شوكلت حليب', 'شوكلت دارك', 'شوكلت أبيض', 'بودرة شوكلت غامق', 'دقيق كويتي شدة', 'عسل',
  'سكر ناعم', 'سكر بودره', 'كريم كراميل بودره', 'حليب مكثف نستله', 'حليب مكثف نوع ٢', 'زيت',
  'بخاخ زبده', 'منجا مجمد', 'بكتين', 'جوز هند', 'سكر بني', 'ملح', 'قشطة جوز هند', 'حليب جوز هند',
  'حليب بودره', 'علب كيك غطا مقاس 30', 'علب 12 أونص', 'علب 8 أونص بودينق', 'علب أكريليك 8 أونص',
  'قواعد كيك ذهبية',
];

function buildDefaultBaseUnits() {
  return [
    { name: 'كيلو', sortOrder: 1, defaultSmallestUnit: 'جرام', defaultFactor: 1000, allowAlternate: false, alternateSmallestUnit: null, alternateFactorInput: false },
    { name: 'جرام', sortOrder: 2, defaultSmallestUnit: 'جرام', defaultFactor: 1, allowAlternate: false, alternateSmallestUnit: null, alternateFactorInput: false },
    { name: 'لتر', sortOrder: 3, defaultSmallestUnit: 'مل', defaultFactor: 1000, allowAlternate: false, alternateSmallestUnit: null, alternateFactorInput: false },
    { name: 'مل', sortOrder: 4, defaultSmallestUnit: 'مل', defaultFactor: 1, allowAlternate: false, alternateSmallestUnit: null, alternateFactorInput: false },
    { name: 'حبة', sortOrder: 5, defaultSmallestUnit: 'حبة', defaultFactor: 1, allowAlternate: false, alternateSmallestUnit: null, alternateFactorInput: false },
    { name: 'كرتون', sortOrder: 6, defaultSmallestUnit: 'كرتون', defaultFactor: 1, allowAlternate: true, alternateSmallestUnit: 'حبة', alternateFactorInput: true },
  ];
}
function buildDefaultPurchaseUnits() { return ['كرتون', 'كيس', 'شدة', 'باكيت', 'حبة', 'كيلو', 'لتر']; }

function buildDefaultDB() {
  return {
    version: 1,
    meta: { baseUnits: buildDefaultBaseUnits(), purchaseUnits: buildDefaultPurchaseUnits() },
    items: SEED_ITEMS.map((name, i) => ({ id: i + 1, name, displayOrder: i + 1, isActive: true })),
    itemSettings: {},
    inventories: [],
    nextItemId: SEED_ITEMS.length + 1,
    nextInventoryId: 1,
    nextLineId: 1,
  };
}

// ============================================================================
// التخزين المحلي (localStorage على جهاز المستخدم فقط)
// ============================================================================
const Store = (() => {
  const KEY = 'sweez_inventory_db_v1';
  let DB = null;

  function isValidShape(obj) {
    return obj && Array.isArray(obj.items) && Array.isArray(obj.inventories) && obj.meta && Array.isArray(obj.meta.baseUnits);
  }

  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (isValidShape(parsed)) { DB = parsed; return; }
      }
    } catch (e) { console.warn('تعذرت قراءة البيانات المحفوظة على هذا الجهاز، سيبدأ التطبيق ببيانات افتراضية.', e); }
    DB = buildDefaultDB();
    persist();
  }

  function persist() {
    try {
      localStorage.setItem(KEY, JSON.stringify(DB));
    } catch (e) {
      console.error('فشل حفظ البيانات محليًا:', e);
      if (typeof UI !== 'undefined') {
        UI.toast('تعذر حفظ البيانات على هذا الجهاز. تأكد من عدم استخدام وضع التصفح الخاص ووجود مساحة تخزين كافية.', 'error', 8000);
      }
    }
  }

  function get() { return DB; }
  function replace(newDb) {
    if (!isValidShape(newDb)) throw new Error('ملف البيانات غير صالح لهذه الأداة.');
    DB = newDb;
    persist();
  }

  load();
  return { get, persist, replace, buildDefaultDB, KEY };
})();

// ============================================================================
// طبقة منطق العمل (تماثل مسارات الخادم في النسخة الأصلية، لكن محليًا بالكامل)
// ============================================================================
const Data = (() => {
  function db() { return Store.get(); }

  function toSnakeSettings(s) {
    return {
      base_unit: s.baseUnit, smallest_unit: s.smallestUnit, base_to_smallest_factor: s.baseToSmallestFactor,
      purchase_content_qty: s.purchaseContentQty, purchase_content_unit: s.purchaseContentUnit, purchase_price: s.purchasePrice,
    };
  }

  // ---- meta ----
  function getMeta() {
    return {
      baseUnits: db().meta.baseUnits.map((b) => ({ ...b })),
      purchaseUnits: db().meta.purchaseUnits.slice(),
    };
  }
  function addBaseUnit(name) {
    name = String(name || '').trim();
    if (!name) throw new Error('اسم الوحدة مطلوب.');
    if (db().meta.baseUnits.some((b) => b.name === name)) throw new Error('هذه الوحدة موجودة مسبقًا.');
    const maxOrder = db().meta.baseUnits.reduce((m, b) => Math.max(m, b.sortOrder), 0);
    db().meta.baseUnits.push({ name, sortOrder: maxOrder + 1, defaultSmallestUnit: name, defaultFactor: 1, allowAlternate: false, alternateSmallestUnit: null, alternateFactorInput: false });
    Store.persist();
    return { ok: true };
  }
  function addPurchaseUnit(name) {
    name = String(name || '').trim();
    if (!name) throw new Error('اسم وحدة الشراء مطلوب.');
    if (db().meta.purchaseUnits.includes(name)) throw new Error('وحدة الشراء هذه موجودة مسبقًا.');
    db().meta.purchaseUnits.push(name);
    Store.persist();
    return { ok: true };
  }

  // ---- items ----
  function loadSettings(itemId) { return db().itemSettings[itemId] || null; }

  function serializeItem(item) {
    const settings = loadSettings(item.id);
    let cost = { content_in_smallest: null, unit_cost: null };
    if (settings) { try { cost = computeItemCost(toSnakeSettings(settings)); } catch (e) { cost = { content_in_smallest: null, unit_cost: null }; } }
    return {
      id: item.id, name: item.name, displayOrder: item.displayOrder, isActive: item.isActive,
      settings: settings ? { ...settings } : null,
      unitCost: cost.unit_cost, contentInSmallest: cost.content_in_smallest,
    };
  }

  function listItems(includeInactive) {
    return db().items.filter((i) => includeInactive || i.isActive)
      .sort((a, b) => a.displayOrder - b.displayOrder).map(serializeItem);
  }

  function addItem(name) {
    name = String(name || '').trim();
    if (!name) throw new Error('اسم الصنف مطلوب.');
    const maxOrder = db().items.reduce((m, i) => Math.max(m, i.displayOrder), 0);
    const item = { id: db().nextItemId++, name, displayOrder: maxOrder + 1, isActive: true };
    db().items.push(item);
    Store.persist();
    return serializeItem(item);
  }

  function validateSettingsPayload(body) {
    const baseUnit = body.baseUnit ? String(body.baseUnit).trim() : null;
    const smallestUnit = body.smallestUnit ? String(body.smallestUnit).trim() : null;
    const purchaseUnit = body.purchaseUnit ? String(body.purchaseUnit).trim() : null;
    const purchaseContentUnit = body.purchaseContentUnit ? String(body.purchaseContentUnit).trim() : null;
    const factor = parseNumericField(body.baseToSmallestFactor, { label: 'معامل تحويل الوحدة الأصغر', requirePositive: true });
    const contentQty = parseNumericField(body.purchaseContentQty, { label: 'محتوى وحدة الشراء', requirePositive: true });
    const price = parseNumericField(body.purchasePrice, { label: 'سعر الشراء' });
    const settings = {
      baseUnit, smallestUnit,
      baseToSmallestFactor: baseUnit && smallestUnit && baseUnit === smallestUnit ? 1 : factor,
      purchaseUnit, purchaseContentQty: contentQty, purchaseContentUnit, purchasePrice: price,
    };
    if (settings.baseUnit && settings.smallestUnit && settings.purchaseContentQty != null && settings.purchaseContentUnit && settings.purchasePrice != null) {
      computeItemCost(toSnakeSettings(settings));
    }
    return settings;
  }

  function updateItem(id, body) {
    const item = db().items.find((i) => i.id === id);
    if (!item) throw new Error('الصنف غير موجود.');
    if (body.name !== undefined) {
      const name = String(body.name).trim();
      if (!name) throw new Error('اسم الصنف مطلوب.');
      item.name = name;
    }
    if (body.isActive !== undefined) item.isActive = !!body.isActive;
    if (body.settings !== undefined) {
      const s = validateSettingsPayload(body.settings || {});
      db().itemSettings[id] = s;
    }
    Store.persist();
    return serializeItem(item);
  }

  function reorderItems(order) {
    if (!Array.isArray(order) || !order.length) throw new Error('قائمة الترتيب غير صالحة.');
    order.forEach((id, idx) => {
      const item = db().items.find((i) => i.id === Number(id));
      if (item) item.displayOrder = idx + 1;
    });
    Store.persist();
    return listItems(true);
  }

  // ---- inventories ----
  function todayStr() {
    const d = new Date(); const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function computeSummary(lines) {
    const totalItems = lines.length;
    const countedItems = lines.filter((l) => l.isCounted).length;
    let totalValue = new Decimal(0);
    lines.forEach((l) => { if (l.inventoryValue != null) totalValue = totalValue.add(l.inventoryValue); });
    return { totalItems, countedItems, remainingItems: totalItems - countedItems, totalValue: totalValue.toNumber() };
  }

  function findInventory(id) {
    const inv = db().inventories.find((i) => i.id === id);
    if (!inv) throw new Error('الجرد غير موجود.');
    return inv;
  }

  function serializeInventoryHeader(inv) {
    const { lines, ...header } = inv;
    return { ...header };
  }

  function listInventories() {
    return db().inventories.slice().sort((a, b) => b.id - a.id)
      .map((inv) => ({ ...serializeInventoryHeader(inv), summary: computeSummary(inv.lines) }));
  }

  function buildLineForItem(invId, item) {
    const settings = loadSettings(item.id);
    let cost = { content_in_smallest: null, unit_cost: null };
    if (settings) { try { cost = computeItemCost(toSnakeSettings(settings)); } catch (e) { /* غير مكتمل بعد */ } }
    return {
      id: db().nextLineId++, inventoryId: invId, itemId: item.id, lineOrder: item.displayOrder, itemName: item.name,
      baseUnit: settings ? settings.baseUnit : null, smallestUnit: settings ? settings.smallestUnit : null,
      baseToSmallestFactor: settings ? settings.baseToSmallestFactor : null,
      purchaseUnit: settings ? settings.purchaseUnit : null, purchaseContentQty: settings ? settings.purchaseContentQty : null,
      purchaseContentUnit: settings ? settings.purchaseContentUnit : null, contentInSmallest: cost.content_in_smallest,
      purchasePrice: settings ? settings.purchasePrice : null, unitCost: cost.unit_cost,
      fullUnitsCount: null, partialQty: null, partialUnit: null, totalQtySmallest: null, inventoryValue: null,
      isCounted: false, notes: null,
    };
  }

  // يضيف تلقائيًا أي صنف نشط جديد (أُضيف بعد بدء هذا الجرد) إلى جرد لا يزال "مسودة"،
  // دون المساس بالجردات المعتمدة (سجل تاريخي ثابت) أو بالأسطر الموجودة أصلًا.
  function syncDraftLines(inv) {
    if (inv.status !== 'draft') return false;
    const existingItemIds = new Set(inv.lines.map((l) => l.itemId));
    const newItems = db().items.filter((i) => i.isActive && !existingItemIds.has(i.id));
    if (!newItems.length) return false;
    newItems.forEach((item) => { inv.lines.push(buildLineForItem(inv.id, item)); });
    inv.lines.sort((a, b) => a.lineOrder - b.lineOrder);
    return true;
  }

  function createInventory(body) {
    const countedBy = String(body.countedBy || '').trim();
    if (!countedBy) throw new Error('اسم القائم بالجرد مطلوب.');
    const inventoryDate = String(body.inventoryDate || '').trim() || todayStr();
    const generalNotes = body.generalNotes ? String(body.generalNotes) : null;

    const items = db().items.filter((i) => i.isActive).sort((a, b) => a.displayOrder - b.displayOrder);
    if (!items.length) throw new Error('لا توجد أصناف نشطة لإنشاء جرد جديد. الرجاء إضافة أصناف أولًا.');

    const invId = db().nextInventoryId++;
    const lines = items.map((item) => buildLineForItem(invId, item));

    const inv = { id: invId, inventoryDate, countedBy, generalNotes, status: 'draft', createdAt: new Date().toISOString(), finalizedAt: null, lines };
    db().inventories.push(inv);
    Store.persist();
    return { ...serializeInventoryHeader(inv), summary: computeSummary(inv.lines) };
  }

  function getInventory(id) {
    const inv = findInventory(id);
    const changed = syncDraftLines(inv);
    if (changed) Store.persist();
    return { ...serializeInventoryHeader(inv), summary: computeSummary(inv.lines), lines: inv.lines.map((l) => ({ ...l })) };
  }

  function updateInventoryHeader(id, body) {
    const inv = findInventory(id);
    if (body.countedBy !== undefined) {
      const v = String(body.countedBy).trim();
      if (!v) throw new Error('اسم القائم بالجرد مطلوب.');
      inv.countedBy = v;
    }
    if (body.inventoryDate !== undefined) {
      const v = String(body.inventoryDate).trim();
      if (!v) throw new Error('تاريخ الجرد مطلوب.');
      inv.inventoryDate = v;
    }
    if (body.generalNotes !== undefined) inv.generalNotes = body.generalNotes ? String(body.generalNotes) : null;
    Store.persist();
    return { ...serializeInventoryHeader(inv), summary: computeSummary(inv.lines) };
  }

  function updateLine(invId, lineId, body) {
    const inv = findInventory(invId);
    const line = inv.lines.find((l) => l.id === lineId);
    if (!line) throw new Error('سطر الجرد غير موجود.');

    const baseUnit = body.baseUnit ? String(body.baseUnit).trim() : null;
    const smallestUnit = body.smallestUnit ? String(body.smallestUnit).trim() : null;
    const purchaseUnit = body.purchaseUnit ? String(body.purchaseUnit).trim() : null;
    const purchaseContentUnit = body.purchaseContentUnit ? String(body.purchaseContentUnit).trim() : null;
    const notes = body.notes ? String(body.notes) : null;
    const partialUnit = body.partialUnit ? String(body.partialUnit).trim() : null;

    const factor = parseNumericField(body.baseToSmallestFactor, { label: 'معامل تحويل الوحدة الأصغر', requirePositive: true });
    const contentQty = parseNumericField(body.purchaseContentQty, { label: 'محتوى وحدة الشراء', requirePositive: true });
    const price = parseNumericField(body.purchasePrice, { label: 'سعر الشراء' });
    const fullUnitsCount = parseNumericField(body.fullUnitsCount, { label: 'عدد وحدات الشراء الكاملة', requireInteger: true });
    const partialQty = parseNumericField(body.partialQty, { label: 'الكمية الجزئية' });

    const settings = {
      baseUnit, smallestUnit,
      baseToSmallestFactor: baseUnit && smallestUnit && baseUnit === smallestUnit ? 1 : factor,
      purchaseUnit, purchaseContentQty: contentQty, purchaseContentUnit, purchasePrice: price,
    };

    const cost = computeItemCost(toSnakeSettings(settings));
    const totals = computeLineTotals({
      base_unit: settings.baseUnit, smallest_unit: settings.smallestUnit, base_to_smallest_factor: settings.baseToSmallestFactor,
      content_in_smallest: cost.content_in_smallest, unit_cost: cost.unit_cost,
      full_units_count: fullUnitsCount, partial_qty: partialQty, partial_unit: partialUnit,
    });

    Object.assign(line, {
      baseUnit: settings.baseUnit, smallestUnit: settings.smallestUnit, baseToSmallestFactor: settings.baseToSmallestFactor,
      purchaseUnit: settings.purchaseUnit, purchaseContentQty: settings.purchaseContentQty, purchaseContentUnit: settings.purchaseContentUnit,
      contentInSmallest: cost.content_in_smallest, purchasePrice: settings.purchasePrice, unitCost: cost.unit_cost,
      fullUnitsCount, partialQty, partialUnit,
      totalQtySmallest: totals.total_qty_smallest, inventoryValue: totals.inventory_value, isCounted: !!totals.is_counted,
      notes,
    });

    if (line.itemId && (settings.baseUnit || settings.purchaseUnit || settings.purchaseContentQty != null || settings.purchasePrice != null)) {
      db().itemSettings[line.itemId] = { ...settings };
    }

    Store.persist();
    return { line: { ...line }, summary: computeSummary(inv.lines) };
  }

  function finalizeInventory(id, force) {
    const inv = findInventory(id);
    const uncounted = inv.lines.filter((l) => !l.isCounted);
    if (uncounted.length && !force) {
      const err = new Error(`يوجد ${uncounted.length} ${uncounted.length === 1 ? 'صنف لم يتم جرده' : 'أصناف لم يتم جردها'} بعد.`);
      err.status = 409;
      err.data = { needsConfirmation: true, uncountedCount: uncounted.length, uncountedNames: uncounted.map((l) => l.itemName), message: err.message };
      throw err;
    }
    inv.status = 'final';
    inv.finalizedAt = new Date().toISOString();
    Store.persist();
    return { ...serializeInventoryHeader(inv), summary: computeSummary(inv.lines) };
  }

  return {
    getMeta, addBaseUnit, addPurchaseUnit,
    listItems, addItem, updateItem, reorderItems,
    listInventories, createInventory, getInventory, updateInventoryHeader, updateLine, finalizeInventory,
    computeSummary,
  };
})();

// ============================================================================
// طبقة توافق تحاكي واجهة fetch (Api.get/post/put) حتى تعمل صفحات الواجهة كما هي
// ============================================================================
const Api = (() => {
  function route(method, url, body) {
    const [path, qs] = url.split('?');
    const params = new URLSearchParams(qs || '');
    const segs = path.split('/').filter(Boolean);
    if (segs[0] !== 'api') throw new Error('مسار غير معروف: ' + url);

    if (segs[1] === 'meta') {
      if (segs.length === 2 && method === 'GET') return Data.getMeta();
      if (segs[2] === 'base-units' && method === 'POST') return Data.addBaseUnit(body.name);
      if (segs[2] === 'purchase-units' && method === 'POST') return Data.addPurchaseUnit(body.name);
    }

    if (segs[1] === 'items') {
      if (segs.length === 2 && method === 'GET') return Data.listItems(params.get('includeInactive') === '1');
      if (segs.length === 2 && method === 'POST') return Data.addItem(body.name);
      if (segs[2] === 'reorder' && segs[3] === 'all' && method === 'PUT') return Data.reorderItems(body.order);
      if (segs.length === 3 && method === 'PUT') return Data.updateItem(Number(segs[2]), body);
    }

    if (segs[1] === 'inventories') {
      if (segs.length === 2 && method === 'GET') return Data.listInventories();
      if (segs.length === 2 && method === 'POST') return Data.createInventory(body);
      if (segs.length === 3 && method === 'GET') return Data.getInventory(Number(segs[2]));
      if (segs.length === 3 && method === 'PUT') return Data.updateInventoryHeader(Number(segs[2]), body);
      if (segs[3] === 'lines' && segs.length === 5 && method === 'PUT') return Data.updateLine(Number(segs[2]), Number(segs[4]), body);
      if (segs[3] === 'finalize' && method === 'POST') return Data.finalizeInventory(Number(segs[2]), !!(body && body.force));
    }

    throw new Error('مسار غير معروف: ' + url);
  }

  function wrap(method, url, body) {
    return Promise.resolve().then(() => route(method, url, body));
  }

  return {
    get: (url) => wrap('GET', url),
    post: (url, body) => wrap('POST', url, body === undefined ? {} : body),
    put: (url, body) => wrap('PUT', url, body === undefined ? {} : body),
  };
})();
</script>

// تصدير CSV (بديل جدول بيانات فعلي يُفتح في Excel/Numbers/Sheets)

const CsvExport = (() => {
  function esc(v) {
    if (v === null || v === undefined) return '';
    const s = String(v);
    if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function num(n) { return n === null || n === undefined ? '' : String(Number(n)); }
  function rowsToCsv(rows) {
    return '﻿' + rows.map((r) => r.map(esc).join(',')).join('\r\n');
  }

  function summaryRows(inv) {
    const rows = [['الصنف', 'الكمية النهائية', 'الوحدة', 'تكلفة الوحدة', 'قيمة المخزون (ر.س)']];
    inv.lines.forEach((l) => {
      rows.push([
        l.itemName,
        l.isCounted ? num(l.totalQtySmallest) : 'لم يتم الجرد',
        l.smallestUnit || '',
        num(l.unitCost),
        l.isCounted ? num(l.inventoryValue) : '',
      ]);
    });
    rows.push(['إجمالي قيمة المخزون', '', '', '', num(inv.summary.totalValue)]);
    return rows;
  }

  function detailedRows(inv) {
    const rows = [[
      'الصنف', 'وحدة الصنف', 'الوحدة الأصغر', 'وحدة الشراء', 'محتوى وحدة الشراء', 'سعر الشراء',

    ]];
    inv.lines.forEach((l) => {
      rows.push([
        l.itemName, l.baseUnit || '', l.smallestUnit || '', l.purchaseUnit || '',
        num(l.purchaseContentQty), num(l.purchasePrice), num(l.unitCost),
        num(l.fullUnitsCount), num(l.partialQty),
        l.isCounted ? num(l.totalQtySmallest) : 'لم يتم الجرد',
        l.isCounted ? num(l.inventoryValue) : '',

      ]);
    });
    rows.push(['إجمالي قيمة المخزون', '', '', '', '', '', '', '', '', '', num(inv.summary.totalValue), '']);
    return rows;
  }

  async function exportInventory(invId, type) {
    const inv = await Api.get(`/api/inventories/${invId}`);
    const rows = type === 'detailed' ? detailedRows(inv) : summaryRows(inv);

// ============================================================================
// النسخ الاحتياطي والاستعادة (نص JSON يحتوي كل بيانات التطبيق)
// ============================================================================
const Backup = (() => {
  function timestamp() {
    const d = new Date(); const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`;
  }

  function showBackupText() {
    const json = JSON.stringify(Store.get(), null, 2);
    showTextExportModal('نسخة احتياطية (JSON)', `sweez-backup-${timestamp()}.json`, json);
  }

  function readFileAsText(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(new Error('تعذرت قراءة الملف المختار.'));
      reader.readAsText(file);
    });
  }

  function restoreFromText(text) {
    let parsed;
    try { parsed = JSON.parse(text); } catch (e) { throw new Error('النص/الملف ليس بصيغة JSON صالحة.'); }
    Store.replace(parsed);
  }

  async function restoreFromFile(file) {
    if (!file) throw new Error('الرجاء اختيار ملف نسخة احتياطية (.json).');
    const text = await readFileAsText(file);
    restoreFromText(text);
  }

  return { showBackupText, restoreFromFile, restoreFromText };
})();

<script>
const Fmt = (() => {
  function money(n) {
    if (n === null || n === undefined || n === '') return '';
    return Number(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function qty(n) {
    if (n === null || n === undefined || n === '') return '';
    const num = Number(n);
    if (Number.isInteger(num)) return num.toLocaleString('en-US');
    return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 3 });
  }
  function unitCost(n) {
    if (n === null || n === undefined || n === '') return '';
    const num = Number(n);
    let s = num.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
    if (!s.includes('.')) s += '.00';
    else if (s.split('.')[1].length < 2) s += '0'.repeat(2 - s.split('.')[1].length);
    return Number(s).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 6 });
  }
  function dateStr(d) {
    const pad = (x) => String(x).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }
  function today() {
    return dateStr(new Date());
  }
  return { money, qty, unitCost, today };
})();
</script>
<script>
const UI = (() => {
  function toast(message, type = 'info', timeout = 4200) {
    const wrap = document.getElementById('toast-wrap');
    const el = document.createElement('div');
    el.className = `toast ${type}`;
    el.textContent = message;
    wrap.appendChild(el);
    setTimeout(() => { el.remove(); }, timeout);
  }

  function errorToast(err) {
    toast(err && err.message ? err.message : String(err), 'error', 6000);
  }

  function esc(s) {
    if (s === null || s === undefined) return '';
    const div = document.createElement('div');
    div.textContent = String(s);
    return div.innerHTML;
  }

  function el(tag, attrs = {}, children = []) {
    const node = document.createElement(tag);
    Object.entries(attrs || {}).forEach(([k, v]) => {
      if (k === 'class') node.className = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else if (v !== null && v !== undefined) node.setAttribute(k, v);
    });
    (Array.isArray(children) ? children : [children]).forEach((c) => {
      if (c === null || c === undefined) return;
      node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    });
    return node;
  }

  // نافذة تأكيد بسيطة تعيد Promise<boolean>
  function confirmDialog({ title, message, confirmText = 'تأكيد', cancelText = 'إلغاء', danger = false }) {
    return new Promise((resolve) => {
      const backdrop = el('div', { class: 'modal-backdrop' });
      const modal = el('div', { class: 'modal' }, [
        el('h3', {}, title || 'تأكيد'),
        el('div', { html: esc(message).replace(/\n/g, '<br>') }),
        el('div', { class: 'modal-actions' }, [
          el('button', {
            class: `btn ${danger ? 'btn-danger' : 'btn-primary'}`,
            onclick: () => { backdrop.remove(); resolve(true); },
          }, confirmText),
          el('button', {
            class: 'btn btn-secondary',
            onclick: () => { backdrop.remove(); resolve(false); },
          }, cancelText),
        ]),
      ]);
      backdrop.appendChild(modal);
      backdrop.addEventListener('click', (e) => { if (e.target === backdrop) { backdrop.remove(); resolve(false); } });
      document.body.appendChild(backdrop);
    });
  }

  function modal(contentNode, { onClose } = {}) {
    const backdrop = el('div', { class: 'modal-backdrop' });
    const modalEl = el('div', { class: 'modal' }, [contentNode]);
    backdrop.appendChild(modalEl);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) close(); });
    document.body.appendChild(backdrop);
    function close() { backdrop.remove(); if (onClose) onClose(); }
    return { close, backdrop, modalEl };
  }

  return { toast, errorToast, esc, el, confirmDialog, modal };
})();
</script>
<script>
const Units = (() => {
  let cache = null;

  async function ensureLoaded() {
    if (!cache) cache = await Api.get('/api/meta');
    return cache;
  }

  function baseUnits() { return cache ? cache.baseUnits : []; }
  function purchaseUnits() { return cache ? cache.purchaseUnits : []; }

  function findBaseUnit(name) {
    return baseUnits().find((b) => b.name === name) || null;
  }

  // خيارات "الوحدة الأصغر" المتاحة لوحدة صنف معيّنة
  function smallestOptionsFor(baseUnitName) {
    const b = findBaseUnit(baseUnitName);
    if (!b) return [];
    const options = [{ value: b.defaultSmallestUnit, factor: b.defaultFactor, factorEditable: false }];
    if (b.allowAlternate && b.alternateSmallestUnit) {
      options.push({ value: b.alternateSmallestUnit, factor: null, factorEditable: !!b.alternateFactorInput });
    }
    return options;
  }

  async function addBaseUnit(name) {
    await Api.post('/api/meta/base-units', { name });
    cache = null;
    await ensureLoaded();
  }

  async function addPurchaseUnit(name) {
    await Api.post('/api/meta/purchase-units', { name });
    cache = null;
    await ensureLoaded();
  }

  return { ensureLoaded, baseUnits, purchaseUnits, findBaseUnit, smallestOptionsFor, addBaseUnit, addPurchaseUnit };
})();
</script>
