        UI.el('a', { class: 'btn btn-primary', href: '#/new' }, 'ابدأ أول جرد'),
      ]));
      return;
    }

    const table = UI.el('table', { class: 'plain-table' }, [
      UI.el('thead', {}, UI.el('tr', {}, [
        UI.el('th', {}, 'تاريخ الجرد'),
        UI.el('th', {}, 'القائم بالجرد'),
        UI.el('th', {}, 'عدد الأصناف المجردة'),
        UI.el('th', {}, 'إجمالي قيمة المخزون'),
        UI.el('th', {}, 'الحالة'),
      ])),
    ]);
    const tbody = UI.el('tbody');
    invs.forEach((inv) => {
      const tr = UI.el('tr', { onclick: () => { window.location.hash = `#/inventory/${inv.id}`; } }, [
        UI.el('td', { class: 'col-left' }, inv.inventoryDate),
        UI.el('td', {}, inv.countedBy),
        UI.el('td', {}, `${inv.summary.countedItems} / ${inv.summary.totalItems}`),
        UI.el('td', {}, `${Fmt.money(inv.summary.totalValue)} ر.س`),
        UI.el('td', {}, UI.el('span', { class: `badge ${inv.status === 'final' ? 'final' : 'draft'}` }, inv.status === 'final' ? 'معتمد' : 'مسودة')),
      ]);
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);

    const wrap = UI.el('div', { class: 'card' }, table);
    container.appendChild(wrap);
  }
  return { render };
})();
</script>
<script>
const ItemsPage = (() => {
  let items = [];

  async function reload() {
    items = await Api.get('/api/items?includeInactive=1');
  }

  function unitSelectWithAdd(selectedValue, options, onAdd, extraClass) {
    const select = UI.el('select', { class: extraClass || '' });
    if (!selectedValue) {
      const placeholder = UI.el('option', { value: '' }, '— اختر —');
      placeholder.setAttribute('selected', 'selected');
      select.appendChild(placeholder);
    }
    options.forEach((opt) => {
      const o = UI.el('option', { value: opt }, opt);
      if (opt === selectedValue) o.setAttribute('selected', 'selected');
      select.appendChild(o);
    });
    select.appendChild(UI.el('option', { value: '__add__' }, '+ إضافة وحدة جديدة...'));
    if (selectedValue && !options.includes(selectedValue)) {
      const o = UI.el('option', { value: selectedValue }, selectedValue);
      o.setAttribute('selected', 'selected');
      select.insertBefore(o, select.firstChild);
    }
    select.addEventListener('change', async () => {
      if (select.value === '__add__') {
        const name = window.prompt('اسم الوحدة الجديدة:');
        if (name && name.trim()) {
          try {
            await onAdd(name.trim());
            const o = UI.el('option', { value: name.trim() }, name.trim());
            select.insertBefore(o, select.lastChild);
            select.value = name.trim();
          } catch (err) { UI.errorToast(err); select.value = selectedValue || ''; }
        } else {
          select.value = selectedValue || '';
        }
      }
    });
    return select;
  }

  function openSettingsModal(item) {
    const s = item.settings || {};
    const baseSelect = unitSelectWithAdd(s.baseUnit, Units.baseUnits().map((b) => b.name), Units.addBaseUnit);
    const smallestSelect = UI.el('select');
    const factorField = UI.el('div', { class: 'field', style: 'display:none;' }, [
      UI.el('label', {}, 'عدد الوحدة الأصغر داخل الوحدة الواحدة'),
      UI.el('input', { type: 'number', min: '0', step: 'any' }),
    ]);
    const factorInput = factorField.querySelector('input');

    function refreshSmallestOptions(selectedSmallest, selectedFactor) {
      smallestSelect.innerHTML = '';
      if (!baseSelect.value) {
        smallestSelect.appendChild(UI.el('option', { value: '' }, '—'));
        smallestSelect.disabled = true;
        updateFactorVisibility(selectedFactor);
        return;
      }
      smallestSelect.disabled = false;
      const options = Units.smallestOptionsFor(baseSelect.value);
      options.forEach((opt) => {
        const o = UI.el('option', { value: opt.value }, opt.value === baseSelect.value ? `${opt.value} (بدون تجزئة)` : opt.value);
        smallestSelect.appendChild(o);
      });
      const match = options.find((o) => o.value === selectedSmallest) || options[0];
      if (match) smallestSelect.value = match.value;
      updateFactorVisibility(selectedFactor);
    }

    function updateFactorVisibility(presetFactor) {
      const options = Units.smallestOptionsFor(baseSelect.value);
      const chosen = options.find((o) => o.value === smallestSelect.value);
      if (chosen && chosen.factorEditable) {
        factorField.style.display = '';
        factorInput.value = presetFactor != null ? presetFactor : (chosen.factor || '');
      } else {
        factorField.style.display = 'none';
        factorInput.value = chosen && chosen.factor != null ? chosen.factor : '';
      }
    }

    baseSelect.addEventListener('change', () => refreshSmallestOptions(null, null));
    smallestSelect.addEventListener('change', () => updateFactorVisibility(null));
    refreshSmallestOptions(s.smallestUnit, s.baseToSmallestFactor);

    const purchaseUnitSelect = unitSelectWithAdd(s.purchaseUnit, Units.purchaseUnits(), Units.addPurchaseUnit);

    const contentQtyInput = UI.el('input', { type: 'number', min: '0', step: 'any', value: s.purchaseContentQty != null ? s.purchaseContentQty : '' });
    const contentUnitSelect = UI.el('select');
    function refreshContentUnitOptions() {
      contentUnitSelect.innerHTML = '';
      const base = baseSelect.value, smallest = smallestSelect.value;
      const opts = (base === smallest ? [base] : [base, smallest]).filter(Boolean);
      if (!opts.length) {
        contentUnitSelect.appendChild(UI.el('option', { value: '' }, '—'));
        contentUnitSelect.disabled = true;
        return;
      }
      contentUnitSelect.disabled = false;
      opts.forEach((u) => contentUnitSelect.appendChild(UI.el('option', { value: u }, u)));
      if (s.purchaseContentUnit && opts.includes(s.purchaseContentUnit)) contentUnitSelect.value = s.purchaseContentUnit;
    }
    baseSelect.addEventListener('change', refreshContentUnitOptions);
    smallestSelect.addEventListener('change', refreshContentUnitOptions);
    refreshContentUnitOptions();

    const priceInput = UI.el('input', { type: 'number', min: '0', step: 'any', value: s.purchasePrice != null ? s.purchasePrice : '' });

    const errBox = UI.el('div', { class: 'helper-text', style: 'color:var(--danger);' });

    const saveBtn = UI.el('button', { class: 'btn btn-primary' }, 'حفظ');
    const cancelBtn = UI.el('button', { class: 'btn btn-secondary' }, 'إلغاء');

    const content = UI.el('div', {}, [
      UI.el('h3', {}, `إعداد وحدات: ${item.name}`),
      UI.el('div', { class: 'form-grid' }, [
        UI.el('div', { class: 'field' }, [UI.el('label', {}, 'وحدة الصنف'), baseSelect]),
        UI.el('div', { class: 'field' }, [UI.el('label', {}, 'الوحدة الأصغر'), smallestSelect]),
      ]),
      factorField,
      UI.el('div', { class: 'form-grid', style: 'margin-top:10px;' }, [
        UI.el('div', { class: 'field' }, [UI.el('label', {}, 'وحدة الشراء'), purchaseUnitSelect]),
        UI.el('div', { class: 'field' }, [UI.el('label', {}, 'سعر وحدة الشراء (ر.س)'), priceInput]),
      ]),
      UI.el('div', { class: 'field', style: 'margin-top:10px;' }, [
        UI.el('label', {}, 'محتوى وحدة الشراء'),
        UI.el('div', { class: 'unit-pair' }, [contentQtyInput, contentUnitSelect]),
      ]),
      errBox,
      UI.el('div', { class: 'modal-actions' }, [saveBtn, cancelBtn]),
    ]);

    const { close } = UI.modal(content);
    cancelBtn.addEventListener('click', close);
    saveBtn.addEventListener('click', async () => {
      errBox.textContent = '';
      saveBtn.disabled = true;
      try {
        await Api.put(`/api/items/${item.id}`, {
          settings: {
            baseUnit: baseSelect.value || null,
            smallestUnit: smallestSelect.value || null,
            baseToSmallestFactor: factorInput.value === '' ? null : Number(factorInput.value),
            purchaseUnit: purchaseUnitSelect.value || null,
            purchaseContentQty: contentQtyInput.value === '' ? null : Number(contentQtyInput.value),
            purchaseContentUnit: contentUnitSelect.value || null,
            purchasePrice: priceInput.value === '' ? null : Number(priceInput.value),
          },
        });
        UI.toast('تم حفظ إعدادات الصنف.', 'success');
        close();
        await reload();
        renderList();
      } catch (err) {
        errBox.textContent = err.message;
      } finally {
        saveBtn.disabled = false;
      }
    });
  }

  let listContainer;

  function renderList() {
    listContainer.innerHTML = '';
    items.forEach((item, idx) => {
      const nameInput = UI.el('input', { class: 'name-input', type: 'text', value: item.name });
      let saveTimer;
      nameInput.addEventListener('input', () => {
        clearTimeout(saveTimer);
        saveTimer = setTimeout(async () => {
          const val = nameInput.value.trim();
          if (!val || val === item.name) return;
          try {
            await Api.put(`/api/items/${item.id}`, { name: val });
            item.name = val;
            UI.toast('تم تحديث اسم الصنف.', 'success', 1800);
          } catch (err) { UI.errorToast(err); nameInput.value = item.name; }
        }, 600);
      });

      const upBtn = UI.el('button', { class: 'btn btn-outline btn-icon btn-sm', title: 'تحريك لأعلى', disabled: idx === 0 ? 'disabled' : null }, '▲');
      const downBtn = UI.el('button', { class: 'btn btn-outline btn-icon btn-sm', title: 'تحريك لأسفل', disabled: idx === items.length - 1 ? 'disabled' : null }, '▼');
      upBtn.addEventListener('click', () => moveItem(idx, idx - 1));
      downBtn.addEventListener('click', () => moveItem(idx, idx + 1));

      const settingsBtn = UI.el('button', { class: 'btn btn-outline btn-sm' }, 'الوحدات والسعر');
      settingsBtn.addEventListener('click', () => openSettingsModal(item));

      const costLabel = item.unitCost != null
        ? UI.el('span', { class: 'helper-text' }, `تكلفة الوحدة: ${Fmt.unitCost(item.unitCost)} ر.س`)
        : UI.el('span', { class: 'helper-text' }, 'لم تُعرَّف الوحدات بعد');

      const activeToggleLabel = item.isActive ? 'نشط' : 'غير نشط';
      const toggleBtn = UI.el('button', { class: `btn btn-sm ${item.isActive ? 'btn-success' : 'btn-secondary'}` }, activeToggleLabel);
      toggleBtn.addEventListener('click', async () => {
        try {
          await Api.put(`/api/items/${item.id}`, { isActive: !item.isActive });
          item.isActive = !item.isActive;
          renderList();
        } catch (err) { UI.errorToast(err); }
      });

      const row = UI.el('div', { class: `items-manage-row ${item.isActive ? '' : 'inactive'}` }, [
        UI.el('span', { class: 'drag-handle' }, [upBtn, downBtn]),
        nameInput,
        costLabel,
        settingsBtn,
        toggleBtn,
      ]);
      listContainer.appendChild(row);
    });
  }

  async function moveItem(from, to) {
    const arr = items.slice();
    const [moved] = arr.splice(from, 1);
    arr.splice(to, 0, moved);
    items = arr;
    renderList();
    try {
      await Api.put('/api/items/reorder/all', { order: items.map((i) => i.id) });
    } catch (err) {
      UI.errorToast(err);
      await reload();
      renderList();
    }
  }

  async function render(container) {
    container.innerHTML = '';
    container.appendChild(UI.el('h1', {}, 'إدارة الأصناف'));
    container.appendChild(UI.el('p', { class: 'helper-text' }, 'يمكنك إضافة صنف جديد، تعديل اسمه، تغيير ترتيبه، تعطيله، أو ضبط وحدات القياس والسعر الخاصة به.'));

    await Units.ensureLoaded();
    await reload();

    const newNameInput = UI.el('input', { type: 'text', placeholder: 'اسم الصنف الجديد' });
    const addBtn = UI.el('button', { class: 'btn btn-primary' }, '+ إضافة صنف');
    async function addItem() {
      const name = newNameInput.value.trim();
      if (!name) return;
      try {
        await Api.post('/api/items', { name });
        newNameInput.value = '';
        await reload();
        renderList();
      } catch (err) { UI.errorToast(err); }
    }
    addBtn.addEventListener('click', addItem);
    newNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') addItem(); });

    const addRow = UI.el('div', { class: 'toolbar' }, [
      UI.el('div', { class: 'group', style: 'flex:1;' }, [newNameInput]),
      addBtn,
    ]);

    listContainer = UI.el('div', { class: 'card' });

    container.appendChild(addRow);
    container.appendChild(listContainer);
    renderList();
  }

  return { render };
})();
</script>
<script>
const InventoryDetailPage = (() => {
  let inv = null;
  let locked = false; // true عند اعتماد الجرد وعدم فتح التعديل بعد
  let tableBody, summaryEls, container, tbl;

  function unitOptionsForContent(base, smallest) {
    if (!base) return [];
    if (!smallest || base === smallest) return [base];
    return [base, smallest];
  }

  function buildSelect(options, selected, onChange, kind) {
    const select = UI.el('select');
    if (!selected) {
      const placeholder = UI.el('option', { value: '' }, '— اختر —');
      placeholder.setAttribute('selected', 'selected');
      select.appendChild(placeholder);
    }
    options.forEach((opt) => {
      const o = UI.el('option', { value: opt }, opt);
      if (opt === selected) o.setAttribute('selected', 'selected');
      select.appendChild(o);
    });
    if (selected && !options.includes(selected)) {
      const o = UI.el('option', { value: selected }, selected);
      o.setAttribute('selected', 'selected');
      select.insertBefore(o, select.firstChild);
    }
    select.appendChild(UI.el('option', { value: '__add__' }, '+ إضافة وحدة...'));
    select.addEventListener('change', async (e) => {
      if (select.value === '__add__') {
        e.stopImmediatePropagation();
        const name = window.prompt('اسم الوحدة الجديدة:');
        if (name && name.trim()) {
          try {
            if (kind === 'purchase') await Units.addPurchaseUnit(name.trim());
            else await Units.addBaseUnit(name.trim());
            const newOpt = UI.el('option', { value: name.trim() }, name.trim());
            select.insertBefore(newOpt, select.lastChild);
            select.value = name.trim();
            onChange(select.value);
          } catch (err) { UI.errorToast(err); select.value = selected || ''; }
        } else {
          select.value = selected || '';
        }
        return;
      }
      onChange(select.value);
    });
    return select;
  }

  function numberInput(value, opts = {}) {
    return UI.el('input', {
      type: 'number',
      step: opts.step || 'any',
      min: opts.min !== undefined ? opts.min : '0',
      value: value !== null && value !== undefined ? value : '',
      placeholder: opts.placeholder || '',
      class: opts.class || '',
    });
  }

  function focusableInputs() {
    return Array.from(tbl.querySelectorAll('tbody tr:not(.row-hidden) input:not([disabled]), tbody tr:not(.row-hidden) select:not([disabled])'));
  }

  function attachEnterNav(input) {
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        input.blur();
        setTimeout(() => {
          const list = focusableInputs();
          const idx = list.indexOf(input);
          if (idx >= 0 && idx < list.length - 1) list[idx + 1].focus();
        }, 0);
      }
    });
  }

  function statusPill(isCounted) {
    return UI.el('span', { class: `status-pill ${isCounted ? 'counted' : 'pending'}` }, isCounted ? 'تم الجرد' : 'لم يتم الجرد');
  }

  function buildRow(line) {
    const tr = UI.el('tr', { class: line.isCounted ? 'row-counted' : '' });
    tr.dataset.itemName = line.itemName;

    const nameTd = UI.el('td', { class: 'col-name' }, line.itemName);

    const baseSelect = buildSelect(Units.baseUnits().map((b) => b.name), line.baseUnit, () => onDefinitionChange(), 'base');
    const baseTd = UI.el('td', {}, baseSelect);

    const smallestSelect = UI.el('select');
    const factorInput = numberInput(line.baseToSmallestFactor, { min: '0', class: 'readonly-calc' });
    factorInput.style.display = 'none';
    factorInput.style.minWidth = '54px';
    const smallestTd = UI.el('td', {}, [smallestSelect, factorInput]);

    function refreshSmallestOptions(triggerChange) {
      const prevValue = smallestSelect.value;
      smallestSelect.innerHTML = '';
      if (!baseSelect.value) {
        smallestSelect.appendChild(UI.el('option', { value: '' }, '—'));
        smallestSelect.disabled = true;
        updateFactorVisibility();
        return;
      }
      smallestSelect.disabled = false;
      const options = Units.smallestOptionsFor(baseSelect.value);
      options.forEach((opt) => {
        smallestSelect.appendChild(UI.el('option', { value: opt.value }, opt.value === baseSelect.value ? `${opt.value} (بدون تجزئة)` : opt.value));
      });
      const target = options.find((o) => o.value === (triggerChange ? null : line.smallestUnit)) || options.find((o) => o.value === prevValue) || options[0];
      if (target) smallestSelect.value = target.value;
      updateFactorVisibility();
    }

    function updateFactorVisibility() {
      const options = Units.smallestOptionsFor(baseSelect.value);
      const chosen = options.find((o) => o.value === smallestSelect.value);
      if (chosen && chosen.factorEditable) {
        factorInput.style.display = '';
        factorInput.classList.remove('readonly-calc');
        factorInput.disabled = false;
        factorInput.placeholder = 'عدد الحبات';
        if (!factorInput.value) factorInput.value = line.baseToSmallestFactor || '';
      } else {
        // التحويل قياسي وتلقائي (مثال: كيلو=1000 جرام) ولا حاجة لعرضه للمستخدم
        factorInput.style.display = 'none';
        factorInput.classList.add('readonly-calc');
        factorInput.disabled = true;
        factorInput.value = chosen && chosen.factor != null ? chosen.factor : '';
      }
    }

    refreshSmallestOptions(false);

    const purchaseUnitSelect = buildSelect(Units.purchaseUnits(), line.purchaseUnit, () => onDefinitionChange(), 'purchase');
    const purchaseUnitTd = UI.el('td', {}, purchaseUnitSelect);

    const contentQtyInput = numberInput(line.purchaseContentQty, { min: '0' });
    const contentUnitSelect = UI.el('select');
    function refreshContentUnitOptions() {
      const prev = contentUnitSelect.value || line.purchaseContentUnit;
      contentUnitSelect.innerHTML = '';
      const opts = unitOptionsForContent(baseSelect.value, smallestSelect.value);
      if (!opts.length) {
        contentUnitSelect.appendChild(UI.el('option', { value: '' }, '—'));
        contentUnitSelect.disabled = true;
        return;
      }
      contentUnitSelect.disabled = false;
      opts.forEach((u) => contentUnitSelect.appendChild(UI.el('option', { value: u }, u)));
      if (opts.includes(prev)) contentUnitSelect.value = prev;
    }
    refreshContentUnitOptions();
    const contentTd = UI.el('td', {}, UI.el('div', { class: 'unit-pair' }, [contentQtyInput, contentUnitSelect]));

    const priceInput = numberInput(line.purchasePrice, { min: '0' });
    const priceTd = UI.el('td', {}, priceInput);

    const unitCostInput = UI.el('input', { type: 'text', class: 'readonly-calc', disabled: 'disabled', value: line.unitCost != null ? Fmt.unitCost(line.unitCost) : '' });
    const unitCostTd = UI.el('td', {}, unitCostInput);

    const fullUnitsInput = numberInput(line.fullUnitsCount, { min: '0', step: '1', placeholder: '—' });
    const fullUnitsTd = UI.el('td', {}, fullUnitsInput);

    const partialQtyInput = numberInput(line.partialQty, { min: '0', placeholder: '—' });
    const partialTd = UI.el('td', {}, partialQtyInput);

    const partialUnitSelect = UI.el('select');
    function refreshPartialUnitOptions() {
      const prev = partialUnitSelect.value || line.partialUnit;
      partialUnitSelect.innerHTML = '';
      const base = baseSelect.value, smallest = smallestSelect.value;
      if (!base || base === smallest) {
        partialUnitSelect.appendChild(UI.el('option', { value: smallest || base || '' }, smallest || base || '—'));
        partialUnitSelect.disabled = true;
      } else {
        partialUnitSelect.disabled = false;
        [base, smallest].forEach((u) => partialUnitSelect.appendChild(UI.el('option', { value: u }, u)));
        if ([base, smallest].includes(prev)) partialUnitSelect.value = prev;
      }
    }
    refreshPartialUnitOptions();
    const partialUnitTd = UI.el('td', {}, partialUnitSelect);

    const totalQtyInput = UI.el('input', { type: 'text', class: 'readonly-calc', disabled: 'disabled', value: line.isCounted ? Fmt.qty(line.totalQtySmallest) : '' });
    const totalQtyTd = UI.el('td', {}, totalQtyInput);

    const valueInput = UI.el('input', { type: 'text', class: 'readonly-calc', disabled: 'disabled', value: line.isCounted && line.inventoryValue != null ? Fmt.money(line.inventoryValue) : '' });
    const valueTd = UI.el('td', { class: 'col-value' }, valueInput);

    const statusTd = UI.el('td', {}, statusPill(line.isCounted));

    const notesInput = UI.el('input', { type: 'text', class: 'notes-input', value: line.notes || '', placeholder: 'ملاحظات' });
    const notesTd = UI.el('td', {}, notesInput);

    [baseSelect, smallestSelect, factorInput, purchaseUnitSelect, contentQtyInput, contentUnitSelect, priceInput, fullUnitsInput, partialQtyInput, partialUnitSelect, notesInput]
      .forEach((inp) => attachEnterNav(inp));

    function onDefinitionChange() {
      refreshSmallestOptions(true);
      refreshContentUnitOptions();
      refreshPartialUnitOptions();
      save();
    }
    smallestSelect.addEventListener('change', () => { updateFactorVisibility(); refreshContentUnitOptions(); refreshPartialUnitOptions(); save(); });

    // بقية الحقول (الأرقام والملاحظات ووحدات المحتوى/الجزئي) تحفظ عند تأكيد القيمة (change يُطلق عند الخروج من الحقل بعد تعديله)
    [factorInput, contentQtyInput, contentUnitSelect, priceInput, fullUnitsInput, partialQtyInput, partialUnitSelect, notesInput]
      .forEach((inp) => inp.addEventListener('change', () => save()));

    async function save() {
      const payload = {
        baseUnit: baseSelect.value || null,
        smallestUnit: smallestSelect.value || null,
        baseToSmallestFactor: factorInput.value === '' ? null : Number(factorInput.value),
        purchaseUnit: purchaseUnitSelect.value || null,
        purchaseContentQty: contentQtyInput.value === '' ? null : Number(contentQtyInput.value),
        purchaseContentUnit: contentUnitSelect.value || null,
        purchasePrice: priceInput.value === '' ? null : Number(priceInput.value),
        fullUnitsCount: fullUnitsInput.value === '' ? null : Number(fullUnitsInput.value),
        partialQty: partialQtyInput.value === '' ? null : Number(partialQtyInput.value),
        partialUnit: partialUnitSelect.value || null,
        notes: notesInput.value.trim() || null,
      };
      try {
        const res = await Api.put(`/api/inventories/${inv.id}/lines/${line.id}`, payload);
        Object.assign(line, {
          baseUnit: res.line.baseUnit,
          smallestUnit: res.line.smallestUnit,
          baseToSmallestFactor: res.line.baseToSmallestFactor,
          purchaseUnit: res.line.purchaseUnit,
          purchaseContentQty: res.line.purchaseContentQty,
          purchaseContentUnit: res.line.purchaseContentUnit,
          contentInSmallest: res.line.contentInSmallest,
          purchasePrice: res.line.purchasePrice,
          unitCost: res.line.unitCost,
          fullUnitsCount: res.line.fullUnitsCount,
          partialQty: res.line.partialQty,
          partialUnit: res.line.partialUnit,
          totalQtySmallest: res.line.totalQtySmallest,
          inventoryValue: res.line.inventoryValue,
          isCounted: res.line.isCounted,
          notes: res.line.notes,
        });
        unitCostInput.value = line.unitCost != null ? Fmt.unitCost(line.unitCost) : '';
        totalQtyInput.value = line.isCounted ? Fmt.qty(line.totalQtySmallest) : '';
        valueInput.value = line.isCounted && line.inventoryValue != null ? Fmt.money(line.inventoryValue) : '';
        tr.classList.toggle('row-counted', !!line.isCounted);
        statusTd.innerHTML = '';
        statusTd.appendChild(statusPill(line.isCounted));
        inv.summary = res.summary;
        updateSummaryBar();
      } catch (err) {
        UI.errorToast(err);
      }
    }

    baseSelect.disabled = locked;
    purchaseUnitSelect.disabled = locked;
    [contentQtyInput, contentUnitSelect, priceInput, fullUnitsInput, partialQtyInput, partialUnitSelect, notesInput].forEach((i) => { i.disabled = locked; });
    smallestSelect.disabled = locked;

    tr.appendChild(nameTd);
    tr.appendChild(baseTd);
    tr.appendChild(smallestTd);
    tr.appendChild(purchaseUnitTd);
    tr.appendChild(contentTd);
    tr.appendChild(priceTd);
    tr.appendChild(unitCostTd);
    tr.appendChild(fullUnitsTd);
    tr.appendChild(partialTd);
    tr.appendChild(partialUnitTd);
    tr.appendChild(totalQtyTd);
    tr.appendChild(valueTd);
    tr.appendChild(statusTd);
    tr.appendChild(notesTd);

    tr._setLocked = (isLocked) => {
      [baseSelect, smallestSelect, purchaseUnitSelect, contentQtyInput, contentUnitSelect, priceInput, fullUnitsInput, partialQtyInput, partialUnitSelect, notesInput].forEach((i) => { i.disabled = isLocked; });
      updateFactorVisibility();
      if (isLocked) factorInput.disabled = true;
    };

    return tr;
  }

  function updateSummaryBar() {
    if (!summaryEls) return;
    summaryEls.total.textContent = inv.summary.totalItems;
    summaryEls.counted.textContent = inv.summary.countedItems;
    summaryEls.remaining.textContent = inv.summary.remainingItems;
    summaryEls.value.textContent = `${Fmt.money(inv.summary.totalValue)} ر.س`;
  }

  function applySearch(term) {
    const t = term.trim();
    Array.from(tableBody.children).forEach((tr) => {
      const match = !t || tr.dataset.itemName.includes(t);
      tr.classList.toggle('row-hidden', !match);
    });
  }

  async function doFinalize(force) {
    try {
      const res = await Api.post(`/api/inventories/${inv.id}/finalize`, { force: !!force });
      inv.status = res.status;
      inv.finalizedAt = res.finalizedAt;
      inv.summary = res.summary;
      UI.toast('تم اعتماد الجرد بنجاح.', 'success');
      render(container, { id: inv.id });
    } catch (err) {
      if (err.status === 409 && err.data && err.data.needsConfirmation) {
        const res = err.data;
        const names = res.uncountedNames.slice(0, 12).join('، ') + (res.uncountedNames.length > 12 ? ' ...' : '');
        const content = UI.el('div', {}, [
          UI.el('h3', {}, 'يوجد أصناف لم يتم جردها'),
          UI.el('p', {}, `${res.message} (${names})`),
          UI.el('div', { class: 'modal-actions' }, [
            UI.el('button', { class: 'btn btn-secondary', onclick: () => modalHandle.close() }, 'الرجوع لإكمال الجرد'),
            UI.el('button', {
              class: 'btn btn-danger',
              onclick: async () => { modalHandle.close(); await doFinalize(true); },
            }, 'اعتماد الجرد رغم ذلك'),
          ]),
        ]);
        var modalHandle = UI.modal(content);
        return;
      }
      UI.errorToast(err);
    }
  }

  async function runExport(fn, btn, busyLabel) {
    const original = btn.textContent;
    btn.disabled = true;
    btn.textContent = busyLabel;
    try {
      await fn();
    } catch (err) {
      UI.errorToast(err);
    } finally {
      btn.disabled = false;
      btn.textContent = original;
    }
  }

  async function render(mountEl, params) {
    container = mountEl;
    await Units.ensureLoaded();
    inv = await Api.get(`/api/inventories/${params.id}`);
    locked = inv.status === 'final';

    container.innerHTML = '';
    container.classList.remove('page-narrow');

    const dateInput = UI.el('input', { type: 'date', value: inv.inventoryDate, disabled: locked ? 'disabled' : null });
    const countedByInput = UI.el('input', { type: 'text', value: inv.countedBy, disabled: locked ? 'disabled' : null });
    const notesInput = UI.el('textarea', { disabled: locked ? 'disabled' : null }, inv.generalNotes || '');
    notesInput.value = inv.generalNotes || '';

    async function saveHeader() {
      try {
        const res = await Api.put(`/api/inventories/${inv.id}`, {
          inventoryDate: dateInput.value,
          countedBy: countedByInput.value.trim(),
          generalNotes: notesInput.value.trim() || null,
        });
        inv.inventoryDate = res.inventoryDate;
        inv.countedBy = res.countedBy;
        inv.generalNotes = res.generalNotes;
      } catch (err) { UI.errorToast(err); }
    }
    [dateInput, countedByInput, notesInput].forEach((i) => i.addEventListener('change', saveHeader));

    const statusBadge = UI.el('span', { class: `badge ${inv.status === 'final' ? 'final' : 'draft'}` }, inv.status === 'final' ? 'معتمد' : 'مسودة');

    const unlockBtn = UI.el('button', { class: 'btn btn-outline btn-sm' }, '✏️ تعديل رغم الاعتماد');
    unlockBtn.style.display = locked ? '' : 'none';
    unlockBtn.addEventListener('click', async () => {
      const ok = await UI.confirmDialog({
        title: 'تعديل جرد معتمد',
        message: 'هذا الجرد معتمد بالفعل. تعديله قد يغيّر سجلًا تاريخيًا. هل تريد المتابعة؟',
        confirmText: 'نعم، فتح التعديل',
        danger: true,
      });
      if (!ok) return;
      locked = false;
      [dateInput, countedByInput, notesInput].forEach((i) => { i.disabled = false; });
      Array.from(tableBody.children).forEach((tr) => tr._setLocked && tr._setLocked(false));
      unlockBtn.style.display = 'none';
    });

    const headerCard = UI.el('div', { class: 'card', style: 'margin-bottom:14px;' }, [
      UI.el('div', { style: 'display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;' }, [
        UI.el('h1', { style: 'margin:0;' }, `جرد ${inv.inventoryDate}`),
        UI.el('div', { style: 'display:flex; align-items:center; gap:10px;' }, [statusBadge, unlockBtn]),
      ]),
      UI.el('div', { class: 'form-grid', style: 'margin-top:12px;' }, [
        UI.el('div', { class: 'field' }, [UI.el('label', {}, 'تاريخ الجرد'), dateInput]),
        UI.el('div', { class: 'field' }, [UI.el('label', {}, 'اسم القائم بالجرد'), countedByInput]),
      ]),
      UI.el('div', { class: 'field', style: 'margin-top:10px;' }, [UI.el('label', {}, 'ملاحظات عامة'), notesInput]),
    ]);

    summaryEls = {
      total: UI.el('div', { class: 'value' }, String(inv.summary.totalItems)),
      counted: UI.el('div', { class: 'value' }, String(inv.summary.countedItems)),
      remaining: UI.el('div', { class: 'value' }, String(inv.summary.remainingItems)),
      value: UI.el('div', { class: 'value' }, `${Fmt.money(inv.summary.totalValue)} ر.س`),
    };
    const summaryBar = UI.el('div', { class: 'summary-bar' }, [
      UI.el('div', { class: 'summary-tile' }, [summaryEls.total, UI.el('div', { class: 'label' }, 'إجمالي الأصناف')]),
      UI.el('div', { class: 'summary-tile value-success' }, [summaryEls.counted, UI.el('div', { class: 'label' }, 'تم جردها')]),
      UI.el('div', { class: 'summary-tile value-danger' }, [summaryEls.remaining, UI.el('div', { class: 'label' }, 'متبقٍ')]),
      UI.el('div', { class: 'summary-tile' }, [summaryEls.value, UI.el('div', { class: 'label' }, 'إجمالي قيمة المخزون')]),
    ]);

    const searchInput = UI.el('input', { type: 'text', placeholder: 'ابحث عن صنف...' });
    searchInput.addEventListener('input', () => applySearch(searchInput.value));

    const finalizeBtn = UI.el('button', { class: 'btn btn-primary' }, '✅ إنهاء الجرد');
    finalizeBtn.addEventListener('click', () => doFinalize(false));
    finalizeBtn.style.display = inv.status === 'final' ? 'none' : '';

    const pdfSummaryBtn = UI.el('button', { class: 'btn btn-outline btn-sm' }, '🖨️ PDF مختصر');
    pdfSummaryBtn.addEventListener('click', () => runExport(() => PrintExport.printInventory(inv.id, 'summary'), pdfSummaryBtn, 'جارٍ التجهيز...'));
    const pdfDetailedBtn = UI.el('button', { class: 'btn btn-outline btn-sm' }, '🖨️ PDF تفصيلي');
    pdfDetailedBtn.addEventListener('click', () => runExport(() => PrintExport.printInventory(inv.id, 'detailed'), pdfDetailedBtn, 'جارٍ التجهيز...'));
    const csvSummaryBtn = UI.el('button', { class: 'btn btn-outline btn-sm' }, '📊 جدول مختصر (CSV)');
    csvSummaryBtn.addEventListener('click', () => runExport(() => CsvExport.exportInventory(inv.id, 'summary'), csvSummaryBtn, 'جارٍ التجهيز...'));
    const csvDetailedBtn = UI.el('button', { class: 'btn btn-outline btn-sm' }, '📊 جدول تفصيلي (CSV)');
    csvDetailedBtn.addEventListener('click', () => runExport(() => CsvExport.exportInventory(inv.id, 'detailed'), csvDetailedBtn, 'جارٍ التجهيز...'));

    const exportGroup = UI.el('div', { class: 'group' }, [pdfSummaryBtn, pdfDetailedBtn, csvSummaryBtn, csvDetailedBtn]);

    const toolbar = UI.el('div', { class: 'toolbar' }, [
      UI.el('div', { class: 'group' }, [UI.el('div', { class: 'search-box' }, [searchInput, UI.el('span', { class: 'icon' }, '🔍')])]),
      UI.el('div', { class: 'group' }, [exportGroup, finalizeBtn]),
    ]);

    tbl = UI.el('table', { class: 'inv-table' });
    const thead = UI.el('thead', {}, UI.el('tr', {}, [
      'الصنف', 'وحدة الصنف', 'الوحدة الأصغر', 'وحدة الشراء', 'محتوى وحدة الشراء', 'سعر الشراء',
      'تكلفة الوحدة الأصغر', 'الوحدات الكاملة', 'الكمية الجزئية', 'وحدة الجزئي', 'إجمالي الكمية',
      'قيمة المخزون', 'حالة الجرد', 'ملاحظات',
    ].map((h, i) => UI.el('th', { class: i === 0 ? 'col-name' : '' }, h))));
    tableBody = UI.el('tbody');
    inv.lines.forEach((line) => tableBody.appendChild(buildRow(line)));
    tbl.appendChild(thead);
    tbl.appendChild(tableBody);
    const tableWrap = UI.el('div', { class: 'table-wrap' }, tbl);

    container.appendChild(headerCard);
    container.appendChild(summaryBar);
    container.appendChild(toolbar);
    container.appendChild(tableWrap);
  }

  return { render };
})();
</script>
<script>
const BackupPage = (() => {
  async function render(container) {
    container.innerHTML = '';
    container.classList.add('page-narrow');
    container.appendChild(UI.el('h1', {}, 'النسخ الاحتياطي والاستعادة'));
    container.appendChild(UI.el('p', { class: 'helper-text' }, 'بيانات هذا التطبيق محفوظة داخل هذا المتصفح فقط على هذا الجهاز، ولا تُرسَل إلى أي خادم. استخدم هذه الصفحة لأخذ نسخة احتياطية دوريًا أو لنقل البيانات إلى جهاز آخر.'));

    const downloadBtn = UI.el('button', { class: 'btn btn-primary' }, '📄 عرض نسخة احتياطية (JSON)');
    downloadBtn.addEventListener('click', () => {
      try {
        Backup.showBackupText();
      } catch (err) {
        UI.errorToast(err);
      }
    });

    const downloadCard = UI.el('div', { class: 'card' }, [
      UI.el('h2', {}, 'إنشاء نسخة احتياطية'),
      UI.el('p', { class: 'helper-text' }, 'يعرض هذا الزر نص JSON يحتوي جميع بيانات البرنامج (الأصناف وجميع عمليات الجرد). انسخه واحفظه في مكان آمن (ملاحظة، ملف نصي، بريد إلكتروني لنفسك...).'),
      downloadBtn,
    ]);

    // --- استعادة من ملف ---
    const fileInput = UI.el('input', { type: 'file', accept: '.json,application/json' });
    const restoreFileBtn = UI.el('button', { class: 'btn btn-danger' }, 'استعادة من ملف');
    restoreFileBtn.addEventListener('click', async () => {
      const file = fileInput.files && fileInput.files[0];
      if (!file) { UI.toast('الرجاء اختيار ملف أولًا.', 'error'); return; }
      await doRestore(() => Backup.restoreFromFile(file), restoreFileBtn);
    });

    // --- استعادة من نص ملصق ---
    const pasteArea = UI.el('textarea', {
      placeholder: 'الصق هنا محتوى النسخة الاحتياطية (JSON) الذي نسخته سابقًا...',
      style: 'width:100%; height:140px; font-family:monospace; font-size:12px; direction:ltr; text-align:left;',
    });
    const restorePasteBtn = UI.el('button', { class: 'btn btn-danger' }, 'استعادة من النص الملصق');
    restorePasteBtn.addEventListener('click', async () => {
      const text = pasteArea.value.trim();
      if (!text) { UI.toast('الرجاء لصق محتوى النسخة الاحتياطية أولًا.', 'error'); return; }
      await doRestore(() => Backup.restoreFromText(text), restorePasteBtn);
    });

    async function doRestore(action, btn) {
      const ok = await UI.confirmDialog({
        title: 'تأكيد الاستعادة',
        message: 'سيتم استبدال جميع البيانات الحالية على هذا الجهاز بالبيانات المستعادة. هل أنت متأكد؟',
        confirmText: 'نعم، استعادة',
        danger: true,
      });
      if (!ok) return;
      btn.disabled = true;
      const original = btn.textContent;
      btn.textContent = 'جارٍ الاستعادة...';
      try {
        await action();
        UI.toast('تمت استعادة النسخة الاحتياطية بنجاح.', 'success');
        setTimeout(() => { window.location.hash = '#/'; window.location.reload(); }, 900);
      } catch (err) {
        UI.errorToast(err);
      } finally {
        btn.disabled = false;
        btn.textContent = original;
      }
    }

    const restoreCard = UI.el('div', { class: 'card', style: 'margin-top:16px;' }, [
      UI.el('h2', {}, 'استعادة نسخة احتياطية'),
      UI.el('p', { class: 'helper-text' }, 'تحذير: الاستعادة تستبدل كل البيانات الحالية على هذا الجهاز بالكامل. اختر إحدى الطريقتين:'),
      UI.el('div', { class: 'field' }, [UI.el('label', {}, '1) من ملف (.json)'), fileInput]),
      UI.el('div', { style: 'margin:8px 0 16px;' }, restoreFileBtn),
      UI.el('div', { class: 'field' }, [UI.el('label', {}, '2) من نص ملصق'), pasteArea]),
      UI.el('div', { style: 'margin-top:8px;' }, restorePasteBtn),
    ]);

    container.appendChild(downloadCard);
    container.appendChild(restoreCard);
  }
  return { render };
})();
</script>
<script>
(() => {
  const app = document.getElementById('app');
  const navLinks = () => Array.from(document.querySelectorAll('#main-nav a'));

  const routes = [
    { pattern: /^#\/$/, render: (c) => HomePage.render(c) },
    { pattern: /^#\/new$/, render: (c) => NewInventoryPage.render(c) },
    { pattern: /^#\/inventory\/(\d+)$/, render: (c, m) => InventoryDetailPage.render(c, { id: Number(m[1]) }) },
    { pattern: /^#\/history$/, render: (c) => HistoryPage.render(c) },
    { pattern: /^#\/items$/, render: (c) => ItemsPage.render(c) },
    { pattern: /^#\/backup$/, render: (c) => BackupPage.render(c) },
  ];

  let currentToken = 0;

  async function handleRoute() {
    const hash = window.location.hash || '#/';
    const token = ++currentToken;
    updateActiveNav(hash);

    for (const route of routes) {
      const m = hash.match(route.pattern);
      if (m) {
        app.innerHTML = '<div class="loading-overlay">جارٍ التحميل...</div>';
        try {
          await route.render(app, m);
        } catch (err) {
          if (token !== currentToken) return;
          console.error(err);
          app.innerHTML = '';
          app.appendChild(UI.el('div', { class: 'empty-state' }, [
            UI.el('h2', {}, 'تعذر تحميل الصفحة'),
            UI.el('p', {}, (err && err.message) || 'حدث خطأ غير متوقع.'),
          ]));
        }
        return;
      }
    }
    app.innerHTML = '';
    app.appendChild(UI.el('div', { class: 'empty-state' }, [UI.el('h2', {}, 'الصفحة غير موجودة')]));
  }

  function updateActiveNav(hash) {
    navLinks().forEach((a) => {
      a.classList.toggle('active', a.getAttribute('data-route') === hash || (a.getAttribute('data-route') === '#/' && hash.startsWith('#/inventory')));
    });
  }

  document.querySelectorAll('[data-nav]').forEach((n) => {
    n.addEventListener('click', () => { window.location.hash = n.getAttribute('data-nav'); });
  });

  window.addEventListener('hashchange', handleRoute);
  window.addEventListener('DOMContentLoaded', async () => {
    try { await Units.ensureLoaded(); } catch (e) { /* سيُعاد المحاولة داخل الصفحات عند الحاجة */ }
    handleRoute();
  });
})();
</script>
